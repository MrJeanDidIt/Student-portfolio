<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Henry Yaps - Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #30363d;
      color: #e5e7eb;
      overflow-x: hidden;
      animation: fadeIn .8s ease-out;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: #30363d;
      color: white;
      padding: 1rem 1.5rem;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
      font-size: 1rem;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h2 {
      margin-top: 2rem;
      font-size: 1.6rem;
      color: #e5e7eb;
    }

    .blog-post {
      background: #484f58;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      color: #e5e7eb;
    }

    .blog-post h3 {
      margin-top: 0;
      color: #e5e7eb;
    }

    .blog-post .date {
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    footer {
      text-align: center;
      margin: 2rem 1rem 1rem;
      font-size: .92rem;
      color: #cbd5e1;
      opacity: 0.95;
    }
  </style>
</head>
<body>

<header>
  <h1>Henry Yaps</h1>
  <p>Blog</p>
</header>

<main>
  <h2>Latest Posts</h2>

  <div class="blog-post">
    <h3>Welcome to Henry Yaps</h3>
    <div class="date">March 23, 2026</div>
    <p>This is my personal blog where I share thoughts, projects, and random yaps about tech, development, and life. Stay tuned for more content!</p>
  </div>

  <!-- Add more blog posts here -->

</main>

<footer>
  <p>&copy; 2026 Henry Jean. All rights reserved.</p>
</footer>

</body>
</html>
