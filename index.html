<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIC Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        .projects {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2rem;
        }
        .project {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 1rem;
            width: 300px;
            text-align: center;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .project:hover {
            transform: scale(1.05);
        }
        .project-icon {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #666;
            position: relative;
        }
        .project-frame {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            background-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .project h3 {
            margin: 1rem 0;
        }
        .project p {
            padding: 0 1rem;
        }
        .project a {
            display: inline-block;
            margin: 1rem;
            padding: 0.5rem 1rem;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .project a:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>EIC Projects Showcase</h1>
    </header>
    <div class="projects">
        <div class="project">
            <div class="project-icon">
                📱
                <div class="project-frame" onclick="viewSubmission('Project 1')">👁️</div>
            </div>
            <h3>Project 1</h3>
            <p>Description of Project 1.</p>
            <a href="#submission1">View Submission</a>
        </div>
        <div class="project">
            <div class="project-icon">
                💻
                <div class="project-frame" onclick="viewSubmission('Project 2')">👁️</div>
            </div>
            <h3>Project 2</h3>
            <p>Description of Project 2.</p>
            <a href="#submission2">View Submission</a>
        </div>
        <div class="project">
            <div class="project-icon">
                🎨
                <div class="project-frame" onclick="viewSubmission('Project 3')">👁️</div>
            </div>
            <h3>Project 3</h3>
            <p>Description of Project 3.</p>
            <a href="#submission3">View Submission</a>
        </div>
        <!-- Add more projects as needed -->
    </div>

    <script>
        function viewSubmission(projectName) {
            alert('Viewing submission for ' + projectName);
            // Here you can implement modal or redirect to submission screen
        }
    </script>
</body>
</html>
