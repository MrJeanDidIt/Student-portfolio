<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #30363d;
      color: #e5e7eb;
      overflow-x: hidden;
      animation: fadeIn .8s ease-out;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: #30363d;
      color: white;
      padding: 1rem 1.5rem;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
      font-size: 1rem;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h2 {
      margin-top: 2rem;
      font-size: 1.6rem;
      color: #e5e7eb;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .project-card {
      background: #484f58;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      padding: 1.5rem;
      color: #e5e7eb;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .project-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }

    .project-card h3 {
      margin-top: 0;
      color: #e5e7eb;
    }

    .project-card p {
      margin: 0.5rem 0;
    }

    .button-primary {
      display: inline-block;
      background: #1e3a8a;
      color: white;
      border: none;
      padding: .65rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: .7rem;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      text-decoration: none;
    }

    .button-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(30, 58, 138, 0.45);
      background: #1e40af;
    }

    footer {
      text-align: center;
      margin: 2rem 1rem 1rem;
      font-size: .92rem;
      color: #cbd5e1;
      opacity: 0.95;
    }
  </style>
</head>
<body>

<header>
  <h1>Projects</h1>
  <p>My Work</p>
</header>

<main>
  <h2>Featured Projects</h2>

  <div class="projects-grid">
    <div class="project-card">
      <h3>Portfolio Website</h3>
      <p>This personal portfolio website showcasing my projects and skills.</p>
      <a href="portfolio.html" class="button-primary">View Project</a>
    </div>

    <div class="project-card">
      <h3>EIC Projects</h3>
      <p>A collection of projects related to EIC.</p>
      <a href="../Downloads/Henry-test/index.html" class="button-primary">View Project</a>
    </div>

    <!-- Add more projects here -->

  </div>
</main>

<footer>
  <p>&copy; 2026 Henry Jean. All rights reserved.</p>
</footer>

</body>
</html>
